title: "JavaScript入門 - タイマーアプリを作ってみよう!"
summary: "
  フレームワークを使わない素の JavaScript（Vanilla JS）で、カウントダウンタイマーとストップウォッチを作る書籍です。

  setInterval によるタイマー制御、状態から画面を作る考え方、Date.now() を使ったずれないタイマー、Web Audio API と async/await まで、3つのフェーズに分けて段階的に完成させます。

  各章の末尾に答え合わせ用のソースコードを掲載しています。手を動かしながら JavaScript の基礎を身につけましょう。
  " # 本の紹介文
