title: "JavaScript入門 - タスク管理アプリを作ってみよう!"
summary: "
  フレームワークを使わない素の JavaScript（Vanilla JS）で、タスク管理アプリ（ToDo アプリ）を作る書籍です。

  配列によるデータの追加・削除・更新、状態から画面を描き直す考え方、イベントデリゲーション、textContent による XSS 対策、localStorage による保存まで、4つのフェーズに分けて段階的に完成させます。

  各章の末尾に答え合わせ用のソースコードを掲載しています。手を動かしながら JavaScript でのデータの扱い方を身につけましょう。
  " # 本の紹介文
